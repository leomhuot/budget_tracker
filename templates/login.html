{% extends 'base.html' %}

{% block title %}Login - Budget Tracker{% endblock %}

{% block body_class %}login-page{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5">
        <div class="card login-card shadow-lg animate__animated animate__zoomIn">
            <div class="card-header text-center">
                <div class="mb-3">
                    <i class="fa-solid fa-vault fa-3x text-primary"></i>
                </div>
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="opacity-75">Log in to manage your budget</p>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                        <label for="username">Username</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        <label for="password">Password</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3 shadow">
                        <i class="fa-solid fa-sign-in-alt me-2"></i>Login
                    </button>
                </form>
                <div class="text-center mt-4">
                    <p class="mb-1 opacity-75">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Sign Up</a></p>
                    <p><a href="{{ url_for('forgot_password') }}" class="opacity-50 small text-decoration-none">Forgot Password?</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
